<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TEDHOUSE – Check In/Out</title>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#0f1117;--surface:#1a1d27;--card:#21253a;--border:#2e3250;
      --accent:#4f8ef7;--green:#3ecf6e;--red:#f76f6f;--yellow:#f5c842;
      --gray:#9aa3be;--text:#e2e8f0;
    }
    body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;
      min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:2rem 1rem}
    .header{text-align:center;margin-bottom:1.5rem}
    .header h1{font-size:1.3rem;font-weight:700;color:var(--accent)}
    .header p{font-size:.85rem;color:var(--gray);margin-top:.3rem}
    .card{background:var(--surface);border:1px solid var(--border);border-radius:14px;
      padding:1.5rem;width:100%;max-width:420px}
    .card.qa-wide{max-width:680px}
    label{display:block;font-size:.75rem;font-weight:700;text-transform:uppercase;
      letter-spacing:.07em;color:var(--gray);margin-bottom:.5rem}
    input[type=text],input[type=password]{
      width:100%;background:var(--card);border:1px solid var(--border);border-radius:8px;
      color:var(--text);font-size:1rem;padding:.75rem 1rem;outline:none;margin-bottom:1rem}
    input[type=text]:focus,input[type=password]:focus{border-color:var(--accent)}
    .btn{width:100%;padding:1.4rem;border:none;border-radius:12px;font-size:1.25rem;font-weight:700;
      cursor:pointer;margin-top:0.5rem;transition:opacity .15s}
    .btn:disabled{opacity:.4;cursor:not-allowed}
    .btn-in {background:var(--green);color:#0f1117}
    .btn-out{background:var(--yellow);color:#0f1117}
    .btn-logout{width:auto;padding:0.5rem 1.2rem;font-size:0.82rem;font-weight:600;
      background:transparent;border:1px solid var(--border);color:var(--gray);
      border-radius:8px;cursor:pointer;margin-top:0}
    .status-box{background:var(--card);border:1px solid var(--border);border-radius:10px;
      padding:1rem;margin:1rem 0;text-align:center}
    .status-box .time{font-size:1.4rem;font-weight:700;color:var(--accent);margin:.3rem 0}
    .status-box .label{font-size:.78rem;color:var(--gray);text-transform:uppercase;letter-spacing:.07em}
    .msg{text-align:center;padding:.75rem 1rem;border-radius:8px;margin-top:1rem;font-size:.88rem;font-weight:600}
    .msg-ok  {background:rgba(62,207,110,.12);color:var(--green);border:1px solid rgba(62,207,110,.3)}
    .msg-err {background:rgba(247,111,111,.12);color:var(--red);border:1px solid rgba(247,111,111,.3)}
    .msg-info{background:rgba(79,142,247,.1);color:var(--accent);border:1px solid rgba(79,142,247,.25)}
    .session-done{text-align:center}
    .session-done .hours{font-size:2rem;font-weight:700;color:var(--green);margin:.5rem 0}
    .session-done .sub{font-size:.82rem;color:var(--gray)}
    .worker-bar{display:flex;align-items:center;justify-content:space-between;
      margin-bottom:1rem;padding-bottom:0.75rem;border-bottom:1px solid var(--border)}
    .worker-bar .name{font-weight:700;font-size:0.95rem}
    .worker-bar .role{font-size:0.75rem;color:var(--gray);margin-top:0.1rem}
  </style>
</head>
<body>

<div class="header">
  <h1>⚡ TEDHOUSE</h1>
  <p id="houseName">Loading…</p>
</div>

<div id="mainCard" class="card">
  <div id="screenLogin">
    <div id="loginMsg" style="display:none" class="msg"></div>
    <label>Username</label>
    <input id="loginUser" type="text" autocomplete="username" placeholder="your.username">
    <label>Password</label>
    <input id="loginPass" type="password" autocomplete="current-password" placeholder="••••••••">
    <button class="btn btn-in" onclick="doLogin()">🔑 Login</button>
  </div>

  <div id="screenAction" style="display:none">
    <div class="worker-bar">
      <div>
        <div class="name" id="workerName"></div>
        <div class="role" id="workerRole"></div>
      </div>
      <button class="btn-logout" onclick="doLogout()">Logout</button>
    </div>
    <div id="actionArea"></div>
    <div id="msgBox" style="display:none" class="msg"></div>
    <div style="margin-top:1.25rem;display:flex;flex-direction:column;gap:.5rem;opacity:.55">
      <div style="display:flex;align-items:center;gap:.5rem">
        <input type="checkbox" id="skipGps" style="width:16px;height:16px;cursor:pointer;accent-color:var(--accent)">
        <label for="skipGps" style="font-size:.72rem;margin:0;text-transform:none;letter-spacing:0;cursor:pointer">Skip location check (testing only)</label>
      </div>
      <div style="display:flex;align-items:center;gap:.5rem">
        <input type="checkbox" id="skipDeviceCheck" style="width:16px;height:16px;cursor:pointer;accent-color:var(--accent)">
        <label for="skipDeviceCheck" style="font-size:.72rem;margin:0;text-transform:none;letter-spacing:0;cursor:pointer">Skip device check (testing only)</label>
      </div>
    </div>
  </div>
</div>

<script>
const houseToken = location.pathname.split('/').filter(Boolean).pop();
let deviceId = null;
let currentWorkerId = null;
let _qaToken = null;

function getDeviceId() {
  let id = localStorage.getItem('tdhDeviceId');
  if (!id) { id = crypto.randomUUID(); localStorage.setItem('tdhDeviceId', id); }
  return id;
}

// ── Init ──────────────────────────────────────────────────────────────────────
async function init() {
  deviceId = getDeviceId();
  try {
    const res = await fetch(`/api/public/checkin/${houseToken}`);
    if (!res.ok) {
      document.getElementById('houseName').textContent = '⚠️ Invalid check-in point';
      document.getElementById('mainCard').style.display = 'none';
      return;
    }
    const data = await res.json();
    document.getElementById('houseName').textContent = '📍 ' + data.houseName;
  } catch(e) {
    document.getElementById('houseName').textContent = '⚠️ Connection error';
  }
  document.getElementById('loginUser').focus();
}

// ── Login ─────────────────────────────────────────────────────────────────────
async function doLogin() {
  const username = document.getElementById('loginUser').value.trim();
  const password = document.getElementById('loginPass').value;
  const msgEl = document.getElementById('loginMsg');

  const showErr = (txt) => {
    msgEl.textContent = txt; msgEl.className = 'msg msg-err'; msgEl.style.display = 'block';
  };

  if (!username || !password) { showErr('Please enter your username and password.'); return; }
  msgEl.textContent = 'Logging in…'; msgEl.className = 'msg msg-info'; msgEl.style.display = 'block';

  try {
    const res = await fetch('/api/worker-login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password, houseToken })
    });
    const data = await res.json();
    if (!res.ok) { showErr('❌ ' + (data.error || 'Login failed.')); return; }

    currentWorkerId = data.workerId;
    if (data.token) _qaToken = data.token;
    document.getElementById('workerName').textContent = (data.role === 'qa_inspector' ? '🔍 ' : '👷 ') + data.workerName;
    document.getElementById('workerRole').textContent = data.houseName ? '📍 ' + data.houseName : '';
    document.getElementById('loginUser').value = '';
    document.getElementById('loginPass').value = '';
    msgEl.style.display = 'none';

    document.getElementById('screenLogin').style.display = 'none';
    document.getElementById('screenAction').style.display = 'block';

    if (data.role === 'qa_inspector') {
      location.href = `/qa.html?house=${houseToken}&name=${encodeURIComponent(data.houseName||'')}&uid=${data.workerId}&uname=${encodeURIComponent(data.workerName||'')}&token=${encodeURIComponent(data.token)}`;
    } else {
      await loadTodayStatus();
    }
  } catch(e) { showErr('❌ ' + e.message); }
}

document.getElementById('loginUser').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('loginPass').focus(); });
document.getElementById('loginPass').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

// ── Logout ────────────────────────────────────────────────────────────────────
function doLogout() {
  currentWorkerId = null;
  document.getElementById('actionArea').innerHTML = '';
  hideMsg();
  document.getElementById('screenAction').style.display = 'none';
  document.getElementById('screenLogin').style.display = 'block';
  document.getElementById('loginUser').focus();
}

// ── Today status ──────────────────────────────────────────────────────────────
async function loadTodayStatus() {
  try {
    const res  = await fetch(`/api/public/checkin/${houseToken}/worker/${currentWorkerId}/today`);
    const data = await res.json();
    renderAction(data);
  } catch(e) { showMsg('❌ Failed to load status: ' + e.message, 'err'); }
}

function renderAction(data) {
  const area = document.getElementById('actionArea');
  hideMsg();

  if (data.status === 'NONE') {
    area.innerHTML = `
      <div class="status-box"><div class="label">Not checked in today</div></div>
      <button class="btn btn-in" onclick="doCheckIn()">✅ Check In</button>`;

  } else if (data.status === 'CHECKED_IN') {
    area.innerHTML = `
      <div class="status-box">
        <div class="label">Checked in at</div>
        <div class="time">${fmtTime(data.checkedInAt)}</div>
      </div>
      <button class="btn btn-out" onclick="doCheckOut(${data.sessionId})">🚪 Check Out</button>`;

  } else {
    const count = data.sessionCount || 1;
    area.innerHTML = `
      <div class="session-done">
        <div class="label" style="color:var(--green);font-size:.75rem;text-transform:uppercase;letter-spacing:.07em;margin-bottom:.5rem">
          Session complete${count > 1 ? ' (' + count + ' today)' : ''}</div>
        <div class="hours">${fmtDuration(data.durationMinutes)}</div>
        <div class="sub">${fmtTime(data.checkedInAt)} → ${fmtTime(data.checkedOutAt)}</div>
      </div>
      <button class="btn btn-in" style="margin-top:1rem" onclick="doCheckIn()">✅ Check In Again</button>`;
  }
}

// ── Check In ──────────────────────────────────────────────────────────────────
async function doCheckIn() {
  let lat = null, lng = null;
  if (!document.getElementById('skipGps').checked) {
    showMsg('📍 Getting your location…', 'info');
    try {
      const pos = await getPosition();
      lat = pos.coords.latitude; lng = pos.coords.longitude;
    } catch(e) {
      showMsg('❌ Location access is required. Please allow location and try again.', 'err');
      return;
    }
  }
  showMsg('Checking in…', 'info');
  try {
    const res  = await fetch(`/api/public/checkin/${houseToken}/session`, {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ workerId: currentWorkerId, deviceId, lat, lng, skipDeviceCheck: document.getElementById('skipDeviceCheck').checked })
    });
    const data = await res.json();
    if (!res.ok) { showMsg('❌ ' + data.error, 'err'); return; }
    showMsg('✅ Checked in at ' + fmtTime(data.checkedInAt), 'ok');
    await loadTodayStatus();
  } catch(e) { showMsg('❌ ' + e.message, 'err'); }
}

// ── Check Out ─────────────────────────────────────────────────────────────────
async function doCheckOut(sessionId) {
  let lat = null, lng = null;
  if (!document.getElementById('skipGps').checked) {
    showMsg('📍 Getting your location…', 'info');
    try {
      const pos = await getPosition();
      lat = pos.coords.latitude; lng = pos.coords.longitude;
    } catch(e) {
      showMsg('❌ Location access is required. Please allow location and try again.', 'err');
      return;
    }
  }
  showMsg('Checking out…', 'info');
  try {
    const res  = await fetch(`/api/public/checkin/${houseToken}/session/${sessionId}/checkout`, {
      method: 'PUT', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ deviceId, lat, lng, skipDeviceCheck: document.getElementById('skipDeviceCheck').checked })
    });
    const data = await res.json();
    if (!res.ok) { showMsg('❌ ' + data.error, 'err'); return; }
    showMsg('✅ Checked out — ' + fmtDuration(data.durationMinutes) + ' today', 'ok');
    await loadTodayStatus();
  } catch(e) { showMsg('❌ ' + e.message, 'err'); }
}

// ── QA Inspector ─────────────────────────────────────────────────────────────
let _qaHouseId = null;
let _qaItems   = [];
let _qaInspectionStageOrder = null;

const _qaL = {
  pending:      { en: 'Pending',      bg: 'Изчакващ' },
  selectStage:  { en: 'Stages to inspect — tap one to open the checklist:', bg: 'Етапи за проверка — натисни за отваряне на списъка:' },
  noStages:     { en: 'No completed stages with checklists found for this house.', bg: 'Няма завършени етапи с контролни списъци за тази сграда.' },
  back:         { en: '← Back', bg: '← Назад' },
  noteLabel:    { en: 'Overall notes', bg: 'Общи бележки' },
  notePlaceholder: { en: 'Optional notes…', bg: 'Незадължителни бележки…' },
  itemNote:     { en: 'Note…', bg: 'Бележка…' },
  save:         { en: 'Save / Запази', bg: 'Запази' },
  cancel:       { en: 'Cancel / Откажи', bg: 'Откажи' },
  saving:       { en: 'Saving…', bg: 'Запазване…' },
  saved:        { en: '✅ Inspection saved', bg: '✅ Проверката е запазена' },
  pass:         { en: '✔ Pass', bg: '✔ Одобрено' },
  fail:         { en: '✘ Fail', bg: '✘ Неодобрено' },
};
function _qaT(k) { const lang = document.documentElement.lang || 'en'; return (_qaL[k]||{})[lang] || _qaL[k]?.en || k; }

async function loadQaStages(houseId) {
  _qaHouseId = houseId;
  const area = document.getElementById('actionArea');
  area.innerHTML = '<div style="text-align:center;padding:2rem;color:#9aa3be">Loading…</div>';
  hideMsg();
  try {
    const res = await fetch(`/api/qa/houses/${houseId}/pending-stages`, {
      headers: _qaToken ? { Authorization: 'Bearer ' + _qaToken } : {}
    });
    const stages = await res.json();
    if (!stages.length) {
      area.innerHTML = `<div style="padding:2rem;text-align:center;color:#9aa3be">${_qaT('noStages')}</div>`;
      return;
    }
    const pending   = stages.filter(s => !s.inspection_id);
    const inspected = stages.filter(s =>  s.inspection_id);

    function stageRow(s) {
      const name = s.stage_name_en || s.stage_name;
      const hasBadge = s.inspection_id != null;
      const badge = hasBadge
        ? `<span style="font-size:0.8rem;padding:3px 10px;border-radius:12px;font-weight:700;background:${s.result==='PASS'?'#3ecf6e':'#f76f6f'};color:#fff">${s.result}</span>`
        : `<span style="font-size:0.8rem;padding:3px 10px;border-radius:12px;font-weight:700;background:#f0a500;color:#fff">${_qaT('pending')}</span>`;
      return `<div onclick="loadQaChecklist(${s.stage_order},'${name.replace(/'/g,"\\'")}')"
        style="display:flex;justify-content:space-between;align-items:center;padding:1rem 1.1rem;border-radius:10px;border:1px solid #2e3250;margin-bottom:0.6rem;cursor:pointer;background:#1a1d27;transition:background 0.15s"
        onmouseover="this.style.background='#22263a'" onmouseout="this.style.background='#1a1d27'">
        <span style="font-size:1rem;font-weight:600">${name}</span>${badge}
      </div>`;
    }

    let html = `<div style="font-size:0.82rem;color:#9aa3be;margin-bottom:1rem">${_qaT('selectStage')}</div>`;
    if (pending.length) html += pending.map(stageRow).join('');
    if (inspected.length) {
      html += `<div style="font-size:0.75rem;color:#9aa3be;text-transform:uppercase;letter-spacing:0.06em;margin:1.2rem 0 0.6rem">Already inspected</div>`;
      html += inspected.map(stageRow).join('');
    }
    area.innerHTML = html;
  } catch(e) { area.innerHTML = `<div style="padding:2rem;text-align:center;color:#f76f6f">❌ ${e.message}</div>`; }
}

async function loadQaChecklist(stageOrder, stageName) {
  _qaInspectionStageOrder = stageOrder;
  const area = document.getElementById('actionArea');
  area.innerHTML = '<div style="text-align:center;padding:2rem;color:#9aa3be">Loading…</div>';
  try {
    const res = await fetch(`/api/qa/houses/${_qaHouseId}/stages/${stageOrder}/checklist`, {
      headers: _qaToken ? { Authorization: 'Bearer ' + _qaToken } : {}
    });
    const data = await res.json();
    _qaItems = data.items.map(it => ({ ...it, _passed: it.passed ?? null }));
    const existing = data.inspection;

    const itemRows = _qaItems.map((it, i) => `
      <div style="border:1px solid #2e3250;border-radius:10px;padding:1rem;margin-bottom:0.75rem">
        <div style="font-size:0.95rem;font-weight:600;margin-bottom:0.75rem">${i+1}. ${it.item_text_en || it.item_text_bg}</div>
        <div style="display:flex;gap:0.6rem;margin-bottom:0.6rem">
          <button onclick="qaMarkItem(${it.id},true)" id="qaPass_${it.id}"
            style="flex:1;padding:0.6rem;border-radius:8px;border:2px solid ${it._passed===true?'#3ecf6e':'#2e3250'};background:${it._passed===true?'#3ecf6e22':'transparent'};color:${it._passed===true?'#3ecf6e':'#9aa3be'};cursor:pointer;font-size:0.9rem;font-weight:700">${_qaT('pass')}</button>
          <button onclick="qaMarkItem(${it.id},false)" id="qaFail_${it.id}"
            style="flex:1;padding:0.6rem;border-radius:8px;border:2px solid ${it._passed===false?'#f76f6f':'#2e3250'};background:${it._passed===false?'#f76f6f22':'transparent'};color:${it._passed===false?'#f76f6f':'#9aa3be'};cursor:pointer;font-size:0.9rem;font-weight:700">${_qaT('fail')}</button>
        </div>
        <input type="text" id="qaNote_${it.id}" placeholder="${_qaT('itemNote')}" value="${(it.note||'').replace(/"/g,'&quot;')}"
          style="width:100%;box-sizing:border-box;font-size:0.82rem;padding:0.4rem 0.6rem;border-radius:6px;border:1px solid #2e3250;background:#0e1120;color:#e2e8f0" />
      </div>`).join('');

    area.innerHTML = `
      <div style="display:flex;align-items:center;gap:0.6rem;margin-bottom:1rem;padding-bottom:0.75rem;border-bottom:1px solid #2e3250">
        <button onclick="loadQaStages(${_qaHouseId})" style="background:none;border:none;color:#4f8ef7;cursor:pointer;font-size:1rem;padding:0">${_qaT('back')}</button>
        <span style="font-size:1.05rem;font-weight:700">${stageName}</span>
      </div>
      ${itemRows}
      <div style="margin-top:0.5rem">
        <div style="font-size:0.75rem;color:#9aa3be;margin-bottom:0.35rem;text-transform:uppercase;letter-spacing:0.05em">${_qaT('noteLabel')}</div>
        <textarea id="qaOverallNote" placeholder="${_qaT('notePlaceholder')}" rows="2"
          style="width:100%;box-sizing:border-box;font-size:0.85rem;padding:0.5rem 0.6rem;border-radius:8px;border:1px solid #2e3250;background:#0e1120;color:#e2e8f0;resize:vertical;margin-bottom:0.75rem">${existing?.notes||''}</textarea>
        <div style="display:flex;gap:0.6rem">
          <button onclick="qaSubmit()" class="btn btn-in" style="flex:1;font-size:1rem">${_qaT('save')}</button>
          <button onclick="loadQaStages(${_qaHouseId})" style="flex:1;padding:0.75rem;border-radius:8px;border:1px solid #2e3250;background:transparent;color:#9aa3be;font-size:1rem;cursor:pointer">${_qaT('cancel')}</button>
        </div>
      </div>`;
  } catch(e) { area.innerHTML = `<div style="padding:2rem;text-align:center;color:#f76f6f">❌ ${e.message}</div>`; }
}

function qaMarkItem(itemId, passed) {
  const item = _qaItems.find(i => i.id === itemId);
  if (item) item._passed = passed;
  const passBtn = document.getElementById(`qaPass_${itemId}`);
  const failBtn = document.getElementById(`qaFail_${itemId}`);
  if (passBtn) {
    passBtn.style.borderColor = passed ? '#3ecf6e' : '#2e3250';
    passBtn.style.background  = passed ? '#3ecf6e22' : 'transparent';
    passBtn.style.color       = passed ? '#3ecf6e' : '#9aa3be';
  }
  if (failBtn) {
    failBtn.style.borderColor = !passed ? '#f76f6f' : '#2e3250';
    failBtn.style.background  = !passed ? '#f76f6f22' : 'transparent';
    failBtn.style.color       = !passed ? '#f76f6f' : '#9aa3be';
  }
}

async function qaSubmit() {
  const anyFailed = _qaItems.some(it => it._passed === false);
  const result = anyFailed ? 'FAIL' : 'PASS';
  const items = _qaItems.map(it => ({
    checklistItemId: it.id,
    passed: it._passed,
    note: (document.getElementById(`qaNote_${it.id}`)?.value || '').trim() || null
  }));
  const notes = (document.getElementById('qaOverallNote')?.value || '').trim() || null;
  showMsg(_qaT('saving'), 'info');
  try {
    const res = await fetch(`/api/qa/houses/${_qaHouseId}/stages/${_qaInspectionStageOrder}/inspect`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', ...(_qaToken ? { Authorization: 'Bearer ' + _qaToken } : {}) },
      body: JSON.stringify({ result, notes, items })
    });
    const data = await res.json();
    if (!res.ok) { showMsg('❌ ' + (data.error || 'Error'), 'err'); return; }
    showMsg(_qaT('saved'), 'ok');
    await loadQaStages(_qaHouseId);
  } catch(e) { showMsg('❌ ' + e.message, 'err'); }
}

// ── Helpers ───────────────────────────────────────────────────────────────────
function getPosition() {
  return new Promise((resolve, reject) =>
    navigator.geolocation.getCurrentPosition(resolve, reject, { timeout: 10000, maximumAge: 0 }));
}
function fmtTime(iso) {
  if (!iso) return '—';
  return new Date(iso).toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' });
}
function fmtDuration(mins) {
  if (mins == null) return '—';
  const h = Math.floor(mins / 60), m = mins % 60;
  return h > 0 ? `${h}h ${m.toString().padStart(2,'0')}m` : `${m}m`;
}
function showMsg(text, type) {
  const el = document.getElementById('msgBox');
  el.textContent = text; el.className = 'msg msg-' + type; el.style.display = 'block';
}
function hideMsg() { document.getElementById('msgBox').style.display = 'none'; }

init();
</script>
</body>
</html>
