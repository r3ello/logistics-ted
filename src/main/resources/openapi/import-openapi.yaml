openapi: 3.0.3

info:
  title: Tedhouse — CSV Data Import & Export API
  version: "1.0.0"
  description: |
    Recurring synchronisation of operational data from spreadsheets into the Tedhouse logistics
    database. Files are uploaded as CSV; each run reports, per row, exactly what it did. In the other
    direction, selected datasets (starting with worker attendance) can be **exported** as CSV — see
    *Export* below.

    This document covers **only** the data-import and data-export surface. The rest of the application's API is
    internal and not part of any integration contract.

    ---

    ## Quick start — syncing the master sheet

    The ACTIVE_MASTER sheet is uploaded **as it is** — no columns to rename, add or remove — and the
    **same file** is sent twice: first to `houses`, then to `house-stages`. A complete run is three
    calls:

    ```bash
    # 1. Sign in. The token is valid for 8 hours; signing in once per run is simplest.
    TOKEN=$(curl -s -X POST https://ops.tedhouse.bg/api/login \
      -H "Content-Type: application/json" \
      -d '{"username":"importer","password":"<password>"}' | jq -r .token)

    # 2. Houses first: creates new projects, updates project data.
    curl -s -X POST "https://ops.tedhouse.bg/api/import/houses?mode=apply" \
      -H "Authorization: Bearer $TOKEN" -F "file=@ACTIVE_MASTER.csv"

    # 3. Then stage progress, from the same file.
    curl -s -X POST "https://ops.tedhouse.bg/api/import/house-stages?mode=apply" \
      -H "Authorization: Bearer $TOKEN" -F "file=@ACTIVE_MASTER.csv"
    ```

    On Windows use `curl.exe` (built into Windows 10 and later) and the same arguments.

    The file is the sheet's **File → Download → Comma-separated values (.csv)** export from Google
    Sheets, which is already UTF-8 with commas — no `delimiter` or `decimal` parameter is needed.

    Each call answers `200` with a report. Look at its **`status`**:

    | `status`  | Meaning                                                    | What to do                                  |
    |-----------|------------------------------------------------------------|---------------------------------------------|
    | `ok`      | Every row was created, updated or already up to date.      | Nothing.                                    |
    | `partial` | Some rows failed or are in conflict; all the others were applied. | Read `errors` and `conflictDetails` — see *Reading the report*. |
    | `failed`  | No row could be processed.                                 | Read `errors`; usually the wrong file.      |

    Running the sync several times a day is expected and safe: a run over an unchanged sheet
    reports everything as `unchanged` and writes nothing.

    ---

    ## Rules that keep the sync correct

    These are the points where a misunderstanding costs real data. Please read them before
    automating anything.

    1. **Always `mode=apply`.** Without it the call is a *dry run* (`mode=validate` is the
       default): the report looks exactly the same — including `created` and `updated` counts — but
       **nothing is written**. Check that `"mode": "apply"` comes back in the report.
    2. **`houses` before `house-stages`, every time.** Stages can only be written for a house that
       already exists. A new project sent to `house-stages` first is rejected (`UNRESOLVED_REF`) and
       is picked up on the next run after `houses`.
    3. **One call at a time.** Wait for each response before sending the next request, and never
       run two syncs in parallel (for example a scheduled job and a manual run at the same moment).
       Two runs creating the same new project at once collide, and one of them is rolled back.
    4. **`Project_ID` is the identity of a project — never change or reuse it.** A changed id is a
       new project to us: a duplicate house is created and the old one stops syncing. A reused id
       overwrites the house it belonged to.
    5. **Do not rename the stage columns.** Stage columns are recognised by their name
       (`7_Ниво замазка` → *Ниво замазка*; the number is ignored). A renamed or misspelt column is
       not recognised, and that stage **silently stops syncing** — it only shows up as an
       `UNKNOWN_COLUMN` warning in the `house-stages` report. Adding, removing or reordering
       columns is fine.
    6. **An empty stage cell means "not started".** Clearing a cell that used to say
       `Петър Завършен` resets that stage. To leave a stage alone, write `Не`.
    7. **Nothing is ever deleted.** A project that disappears from the sheet stays in the
       application. Removals are done by hand in the application — tell us.

    ---

    ## The master sheet, column by column

    ### What `houses` reads

    | Sheet column        | Stored as             | Notes                                                    |
    |---------------------|-----------------------|----------------------------------------------------------|
    | `Project_ID`        | the key               | Required. Shown in the application as **External ID**.   |
    | `Project_Name`      | name                  | Required, max 150 characters.                            |
    | `Location`          | Google Maps link      | Optional, stored as given. It does **not** place the house on the map. |
    | `Client_Name`       | client                | Optional.                                                |
    | `Project_Link`      | Drive folder link     | Optional.                                                |
    | `Google_Chat_ID`    | Google Chat space     | Optional.                                                |
    | `Google_Album_ID`, `Google_Album_URL` | Google Photos album | Optional.                               |
    | `Calculator_SS_Id`, `Prj_Master_SS_Id` | spreadsheet ids (not URLs) | Optional.                      |

    Columns accepted under our own names too: `address`, `lat`, `lng` (decimal coordinates),
    `start_date`, `scaffold_status`, `scaffold_start_date`, `scaffold_end_date`. The complete,
    authoritative list is `GET /api/import/entities`.

    A **new `Project_ID`** creates a house together with everything the application needs around it
    (internal warehouse, stage checklist, QR check-in code, document folders). **The new house has
    no map position**: the sheet carries only a Maps link, and coordinates are not derived from it.
    We place new houses on the map; alternatively a `lat`/`lng` pair can be sent in the file.

    An **existing `Project_ID`** has only the changed columns updated. A column that is not in the
    file is not touched; an **empty cell in a present column clears that value**.

    ### What `house-stages` reads

    One row per project, keyed by `Project_ID`. Every column whose name is a construction stage is
    read; the others are ignored. Each cell is read as *"&lt;who&gt; &lt;status&gt;"*:

    | Cell                                                        | Result                                       |
    |-------------------------------------------------------------|----------------------------------------------|
    | *(empty)*                                                   | Not started; the assignee is cleared.        |
    | `Не`                                                        | **Left untouched** — the sheet does not manage this stage for this project. |
    | `<name> Завършен` / `изпълнил` / `изпълнен` / `Монтирана` / `Взети размери` | Done, by `<name>`.           |
    | `<name> в Процес`                                           | In progress, by `<name>`.                    |
    | a name alone (`Жоро`, `Слави Р`; one to three words)        | Assigned to that person, not started.        |
    | `Завършен` / `в Процес` without a name                       | Done / in progress; the assignee is unchanged. |
    | any other text (`Междинен`, `От клиент`, `vrati-yukka.bg`)  | Stored as the stage's **note**; status and assignee unchanged. |

    The status word must be the **last** thing in the cell and is not case-sensitive.

    - **Dates are never set from the sheet** — it carries none.
    - **Foundation (`Фундамент`).** The sheet has no column for it today. Until it does, the
      foundation is marked done as soon as any other stage is in progress or done. Once a
      `Фундамент` column is added, it is read like any other stage.
    - **Progress entered in the application is protected.** If a crew leader marks a stage done in
      the application, the next sync keeps it (`keptApp`) instead of overwriting it with the older
      sheet value. Only when the sheet cell itself changes does the sheet win — and if it changes
      to something *different* from the application, that is a conflict (below).

    ### Warnings you should expect

    Because both importers read the same file, each reports the other's columns as ignored. These
    `UNKNOWN_COLUMN` warnings are **normal**:

    - in the `houses` report: every stage column (`1_конструкция` … `26_приключване`);
    - in the `house-stages` report: `project_name`, `location`, `client_name`, `project_link`,
      `google_chat_id`, `google_album_id`, `google_album_url`, `calculator_ss_id`, `prj_master_ss_id`.

    Any **other** `UNKNOWN_COLUMN` in the `house-stages` report — especially one that looks like a
    stage name — means a stage is not being synced (rule 5).

    `ADOPTED_EXISTING` appears once for each new project in its first `house-stages` run. It is
    expected and needs no action.

    ---

    ## Reading the report

    Every row of the file lands in exactly one counter:

    | Counter     | Meaning                                                              | Action |
    |-------------|----------------------------------------------------------------------|--------|
    | `created`   | New key — a record was created.                                      | None.  |
    | `updated`   | The sheet changed and the application did not — the sheet was applied. | None. |
    | `unchanged` | Nothing to do.                                                       | None.  |
    | `keptApp`   | The application changed and the sheet did not — the application's value was kept. | None, unless the sheet is right: then edit the cell. |
    | `conflicts` | The same field changed on **both** sides, to different values.       | Decide which one is right (below). |
    | `failed`    | The row was rejected (`errors` says which line, column and why).     | Fix the cell in the sheet. |

    `line` in `errors` and `conflictDetails` is the line of the CSV file: line 1 is the header, so (as long as
    no cell contains a line break) line *N* is row *N* of the sheet.

    ### Resolving a conflict

    A conflict lists the field, the value both sides agreed on at the last sync (`base`), what the
    application holds now (`app`) and what the sheet says now (`sheet`). The record is left exactly
    as it was, and **the whole row waits**: for `house-stages` that means *no stage of that project*
    is updated until the conflict is resolved. The same conflict is reported on every run until then.

    It resolves itself as soon as both sides say the same thing again:

    - **the application is right** → change the sheet cell to match it, or
    - **the sheet is right** → ask Tedhouse to correct the value in the application.

    For stages, `column` names the stage and the part that conflicts — `stage_8_status` is the
    status of stage *Ниво замазка* (the `message` spells the name out) — and `app`/`sheet` use
    these status values:

    | Value         | Written in the sheet as      |
    |---------------|------------------------------|
    | `NOT_STARTED` | empty cell                   |
    | `ASSIGNED`    | `<name>`                     |
    | `IN_PROGRESS` | `<name> в Процес`            |
    | `DONE`        | `<name> Завършен`            |

    ### When something goes wrong

    | Symptom | Cause |
    |---|---|
    | The report says `created`/`updated` but nothing changed in the application | The call was a dry run: `mode=apply` is missing (rule 1). |
    | `house-stages` rejects a project with `UNRESOLVED_REF` | `houses` was not run first, or that project's row failed in the `houses` report — look there. |
    | A stage never changes in the application | Its column name is not recognised (look for `UNKNOWN_COLUMN`), the cell says `Не`, or the row is waiting on a conflict. |
    | A new project is not on the map | Expected — see *What `houses` reads*. |
    | A duplicate project appeared | Its `Project_ID` was changed in the sheet (rule 4). Tell us — it has to be fixed by hand. |
    | `401` | The token expired (8 hours) or is missing — sign in again. |
    | `400` with `ENCODING` | The file is not UTF-8 — re-export from Google Sheets as CSV. |
    | `500` | Retry once a few minutes later. If it persists, send us the `requestId` from the response. |

    When reporting a problem, include the report's **`batchId`** (or the `requestId` of an error):
    it lets us find the exact run.

    ---

    ## How the sync decides

    **1. Rows are matched by an external key, never by name.**
    Almost no table in this schema has a natural unique key — `material.name`, `house.name`,
    `supplier.name` and `worker.name` are all non-unique (there are already nine workers called
    *Георги …*). So every importable row carries a `key` column owned by **your** spreadsheet, and the
    mapping `key → internal id` is stored on our side. The same key in a later run updates the same
    record; a new key creates a new record.

    For **houses** the key is also stored on the house itself and shown in the application as its
    **External ID**, where it can be searched and filtered. It works in both directions: a house
    created by hand in the application with its External ID filled in is **adopted** by the first
    import row carrying that key — updated, not duplicated (reported with an `ADOPTED_EXISTING`
    warning). Editing a house's External ID in the application re-keys it for the import as well.

    > **The `key` column is the contract.** Changing a row's key detaches it from its record and
    > creates a duplicate. Reusing a key for a different real-world entity re-points it at the wrong
    > record. Freeze and protect that column in the source sheet.

    **2. Nothing is ever deleted.** A row that disappears from the sheet is left untouched in the
    database. Removals are performed by hand in the application.

    **3. Every run is a three-way merge, not an overwrite.** Between two runs both sides move: you
    edit the sheet, and dispatchers and crew leaders edit the same records in the app. Each column is
    therefore compared three ways — the incoming CSV value, the current database value, and the
    baseline that the last run recorded:

    | App changed | Sheet changed | Outcome     | Written |
    |-------------|---------------|-------------|---------|
    | no          | no            | `unchanged` | no      |
    | no          | yes           | `updated`   | yes     |
    | yes         | no            | `kept_app`  | no      |
    | yes         | yes           | `conflict`  | no      |

    If both sides changed to the **same** value, there is nothing to decide and the field counts as
    unchanged.

    Detection is per column, but **application is per row**: once any column conflicts the whole row
    is skipped, because fields here are coupled (status with start/end date, quantity with unit) and
    writing half of them would leave an inconsistent record.

    **4. Conflicts are reported, never guessed.** A conflicting row is left exactly as it was and
    reported with all three values so a human can decide.

    **5. `mode=validate` is the default.** A validate run parses the file, resolves keys and performs
    the complete merge, then reports every outcome **without a single write**. The report is
    byte-identical to what `mode=apply` would produce. Use it to preview a run — for example after
    restructuring the sheet — and remember that routine runs need `mode=apply`.

    ---

    ## CSV format

    - **UTF-8 only.** A byte-order mark is tolerated and stripped. A file in another encoding is
      rejected outright (`ENCODING`) rather than transcoded on a guess — the data is Cyrillic and a
      wrong guess produces plausible-looking mojibake that then reaches the database.
    - **RFC 4180** quoting (`"` doubled inside quoted fields), CRLF or LF, embedded newlines allowed
      inside quoted cells.
    - **Header row required on line 1**, matched case-insensitively and order-independently.
      Fully blank lines are skipped. Unknown columns are ignored and reported as warnings.
    - **An absent column is not an empty cell.** A column missing from the header means *this file
      does not manage that field*, and the field is excluded from the merge entirely. An empty cell in
      a column that **is** present means NULL, and that is a value the merge will apply.
    - **Delimiter and decimal separator are explicit request parameters**, never auto-detected —
      `1,234` is genuinely ambiguous between 1234 and 1.234. Grouping separators are not supported.
      A comma-decimal file must use `;` as its delimiter, which is what Bulgarian-locale spreadsheets
      export anyway. (Google Sheets' CSV download is comma-separated with dot decimals: the defaults.)
    - **Dates** ISO `YYYY-MM-DD` (`DD.MM.YYYY`, `DD/MM/YYYY` and `YYYY/MM/DD` are also accepted).
    - **Booleans**: `true`/`false`, `1`/`0`, `yes`/`no`, `да`/`не`.
    - **Multi-value cells** are pipe-separated: `3|4|5|6|19`.
    - **No `id` columns, ever.** Identity is the `key`.
    - Maximum 50 000 data rows and 10 MB per file.

    Call `GET /api/import/entities` for the authoritative list of importable entities and the exact
    columns each one manages — it is generated from the code, so it cannot drift from what the server
    actually accepts.

    ---

    ## Export

    Read-only CSV downloads, the mirror image of the import. `GET /api/export/entities` lists every
    dataset with its **filters** and its **columns**; `GET /api/export/{entity}` returns the file.

    - **Choose your columns** with `columns=a,b,c`: only those, in that order. Omit it to get the
      dataset's default columns (the catalogue marks them `default: true`). An unknown column is a
      `400` listing the valid ones.
    - **Filters are declared per dataset** and type-checked. An unknown query parameter is a `400`
      rather than being ignored, so a misspelt filter can never silently widen an export.
    - **Same dialect as the import**: `delimiter` (`comma` | `semicolon` | `tab`) and `decimal`
      (`dot` | `comma`; comma requires a non-comma delimiter). UTF-8 with a byte-order mark, RFC 4180
      quoting, CRLF line endings.
    - **Timestamps** are `timestamps=iso` (default, `2026-09-24T07:30:00+03:00`) or `local`
      (`2026-09-24 07:30:00`, Europe/Sofia — what spreadsheets parse as a date-time).
    - **Formula-injection guard**: a text cell beginning with `=`, `+`, `-`, `@`, tab or CR is
      prefixed with `'`. Numeric, date and timestamp cells are never altered.
    - Every export is recorded in the application's audit log (dataset, filters, columns, row count).

    ### Attendance

    Both datasets read the QR check-in log and share one counting rule: a closed session counts
    check-in → check-out; a session still open **today** counts check-in → now (`IN_PROGRESS`); a
    session left open on a **past** day counts **0** and is flagged `MISSING_CHECKOUT`, because its
    real end time is unknown. `from`/`to` are required and span at most 366 days; `houseExternalId`
    narrows to one house by its External ID. Device identifiers and GPS coordinates are never
    exported.

    - `attendance-sessions` — one row per check-in.
    - `attendance-daily` — one row per worker per work day with at least one check-in; its
      `counted_minutes` sum to exactly the sessions' for the same filters.

    Houses are identified by `house_external_id`, the same key the house import uses.

    ---

    ## Authentication

    Every endpoint requires a JWT bearer token. Obtain one from `POST /api/login` and send it as
    `Authorization: Bearer <token>` on each request. Tokens expire (8 hours by default); there is no
    refresh endpoint — log in again.

    You will be issued an account with the **`importer`** role. That role reaches this API and
    nothing else: every other endpoint of the application rejects it with `403`. This is deliberate —
    the data import needs no access to the dispatcher and administration surface, so it is not
    granted any. Administrators can also call these endpoints.

    For exports you will be issued an account with the **`exporter`** role instead: it reaches the
    `/api/export` endpoints and this document, and nothing else — not even the import.

  contact:
    name: Tedhouse
  license:
    name: Proprietary

servers:
  - url: https://ops.tedhouse.bg
    description: Production

security:
  - bearerAuth: []

tags:
  - name: Authentication
    description: Obtaining a token. Not part of the import surface, but required to use it.
  - name: Import
    description: Uploading and dry-running CSV files.
  - name: Export
    description: Downloading datasets as CSV, with the columns you choose.
  - name: Documentation
    description: This document, machine-readable.

paths:

  /api/login:
    post:
      tags: [Authentication]
      summary: Obtain a JWT bearer token
      description: |
        Returns a token to be sent as `Authorization: Bearer <token>` on every other call. The
        account must have the `importer` role (or `admin`) to use the import endpoints, and the
        `exporter` role (or `admin`) to use the export endpoints.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              username: importer
              password: "s3cret"
      responses:
        '200':
          description: Authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
              example:
                token: eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJpbXBvcnRlciJ9.xxxxx
                tokenType: Bearer
                expiresIn: 28800
                user: { id: 3, username: importer, role: importer }
        '400':
          description: Username or password missing.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { error: "Username and password required." }
        '401':
          description: Wrong credentials.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { error: "Invalid credentials." }

  /api/import/entities:
    get:
      tags: [Import]
      summary: List the importable entities and their columns
      description: |
        The self-describing catalogue of the sync, in dependency order — files must be imported in
        the order returned, because a child file can only reference keys a previous file created.

        It is derived from the server's own importer registry, so it cannot describe an entity that
        does not exist or omit one that does. Treat it as the source of truth for column names and
        build your export against it.

        `columns` is the complete set of fields the sync **owns** for that entity. A field that is
        not listed can never be written by an import and can never conflict — worker credentials, for
        example, are deliberately absent so a recurring run cannot rotate every crew's PIN.
      operationId: listImportEntities
      responses:
        '200':
          description: The catalogue.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/EntityDescriptor' }
              example:
                - name: houses
                  entityType: house
                  keyColumn: key
                  required: [name]
                  columns: { name: text, address: text, location: text, lat: decimal, lng: decimal,
                             start_date: date, scaffold_status: enum, scaffold_start_date: date,
                             scaffold_end_date: date, client_name: text, drive_folder_url: text,
                             google_chat_id: text, google_album_id: text, google_album_url: text,
                             calculator_sheet_id: text, master_sheet_id: text }
                  dependsOn: []
                - name: house-stages
                  entityType: house_stages
                  keyColumn: key
                  required: []
                  columns: { конструкция: text, ламперия: text, ел: text, вик: text }
                  dependsOn: [houses]
                - name: materials
                  entityType: material
                  keyColumn: key
                  required: [name, unit]
                  columns: { name: text, price: decimal, unit: text }
                  dependsOn: []
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/import/templates/{entity}:
    get:
      tags: [Import]
      summary: Download a blank CSV template
      description: |
        A header-only CSV for the entity, prefixed with a UTF-8 byte-order mark so that Excel on
        Windows opens the Cyrillic correctly instead of mangling it.

        Columns are emitted alphabetically after the key column; order does not matter on upload.
      operationId: getImportTemplate
      parameters:
        - $ref: '#/components/parameters/Entity'
      responses:
        '200':
          description: The template.
          headers:
            Content-Disposition:
              description: 'Always `attachment; filename="<entity>.csv"`.'
              schema: { type: string }
          content:
            text/csv:
              schema: { type: string }
              example: "key,name,price,unit\n"
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: No importer is registered under that name. Empty body — call `/api/import/entities` for the valid list.

  /api/import/{entity}:
    post:
      tags: [Import]
      summary: Run one CSV file
      description: |
        Uploads one file as `multipart/form-data` under the field name **`file`**, and returns the
        run report.

        **The response is `200 OK` whenever the *file* parsed**, even when individual rows failed or
        conflicted — the verdict is in `status`, and the per-row detail is in `errors`,
        `conflictDetails` and `warnings`. A `4xx` means the file itself could not be processed at all
        and nothing was attempted.

        Errors are addressed by line and column, because a recurring sync is a standing conversation
        with whoever maintains the spreadsheet and *"constraint violation on row 402"* is useless to
        them. `line` is the physical line number in the uploaded file, so it matches what they see.

        ### Routine runs

        Send the file with `mode=apply` and check `status` in the report (see *Quick start*). For
        the master sheet that is two calls — `houses`, then `house-stages` — one after the other.

        ### First run, or after restructuring the sheet

        1. `POST` the file with `mode=validate` (the default) and read the report.
        2. Fix whatever it reports in the source sheet — errors first, then conflicts.
        3. Re-run with `mode=validate` until only `created` / `updated` / `unchanged` remain.
        4. `POST` the same file with `mode=apply`.
        5. `POST` it once more with `mode=apply`. **Everything should now report `unchanged`.**
           If it does not, stop and report it: a steady-state run that still writes means the
           synchronisation state is wrong and every future run will rewrite rows it should not.
      operationId: importFile
      parameters:
        - $ref: '#/components/parameters/Entity'
        - name: mode
          in: query
          required: false
          description: |
            `validate` (default) performs the entire run — parsing, key resolution, validation and
            the full merge — and reports every outcome **without writing anything**. `apply` performs
            the writes. The report shape is identical either way.

            A validate run does record one entry in the import history; that is deliberate, so every
            attempt is accounted for.
          schema:
            type: string
            enum: [validate, apply]
            default: validate
        - name: onError
          in: query
          required: false
          description: |
            `skip` (default) commits the rows that succeeded and reports the rest — the right
            behaviour for a recurring run, where one bad row should not block the week's data.
            `abort` rolls the entire file back if any row failed. The report is the same in both
            cases, and the run is recorded in the history either way.
          schema:
            type: string
            enum: [skip, abort]
            default: skip
        - name: delimiter
          in: query
          required: false
          description: Field separator. Bulgarian-locale spreadsheets export `semicolon`.
          schema:
            type: string
            enum: [comma, semicolon, tab]
            default: comma
        - name: decimal
          in: query
          required: false
          description: |
            Decimal separator. Never auto-detected. A file using `comma` decimals must also use
            `semicolon` as its delimiter — comma decimals with comma delimiters are unparseable by
            construction.
          schema:
            type: string
            enum: [dot, comma]
            default: dot
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: The CSV file. UTF-8, max 10 MB, max 50 000 data rows.
            encoding:
              file:
                contentType: text/csv
      responses:
        '200':
          description: |
            The file parsed and the run completed. Check `status` — `ok`, `partial` (some rows failed
            or conflicted) or `failed` (every row failed).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportReport' }
              examples:
                masterHouses:
                  summary: Master sheet → houses — two new projects
                  value:
                    batchId: 4d1e8b20-7f3a-4c6e-9b15-2a8c0f7d3e91
                    entity: houses
                    mode: apply
                    status: ok
                    rowsRead: 58
                    created: 2
                    updated: 1
                    unchanged: 55
                    keptApp: 0
                    conflicts: 0
                    failed: 0
                    warnings:
                      - line: 0
                        code: UNKNOWN_COLUMN
                        column: 1_конструкция
                        message: Column is not managed by the 'houses' importer and was ignored.
                    conflictDetails: []
                    errors: []
                masterStages:
                  summary: Master sheet → house-stages — progress updates and a conflict
                  value:
                    batchId: 9a3f6c71-2e48-4b0d-8c5a-61f7d2e4b308
                    entity: house-stages
                    mode: apply
                    status: partial
                    rowsRead: 58
                    created: 0
                    updated: 6
                    unchanged: 49
                    keptApp: 2
                    conflicts: 1
                    failed: 0
                    warnings:
                      - line: 0
                        code: UNKNOWN_COLUMN
                        column: project_name
                        message: Column is not managed by the 'house-stages' importer and was ignored.
                      - line: 57
                        code: ADOPTED_EXISTING
                        column: key
                        message: >-
                          Key 'TH-2026-041' matched an existing house_stages (id 114) created in the
                          app with the same external id; it was updated, not duplicated.
                    conflictDetails:
                      - conflictId: 12
                        line: 9
                        key: TH-2025-012
                        column: stage_8_status
                        base: IN_PROGRESS
                        app: DONE
                        sheet: NOT_STARTED
                        message: >-
                          Stage 'Ниво замазка' (status) changed in both the app and the sheet since
                          the last sync. Row left untouched.
                    errors: []
                firstRun:
                  summary: First sync, dry run — three new materials
                  value:
                    batchId: 0f6a1c8e-3b52-4a1d-9f2c-7d41e0a9b511
                    entity: materials
                    mode: validate
                    status: ok
                    rowsRead: 3
                    created: 3
                    updated: 0
                    unchanged: 0
                    keptApp: 0
                    conflicts: 0
                    failed: 0
                    warnings: []
                    conflictDetails: []
                    errors: []
                steadyState:
                  summary: Re-run of an unchanged file — the property to check after every apply
                  value:
                    batchId: 2b7e4f10-9c31-4d5a-8e02-1f9a3c7b6d42
                    entity: materials
                    mode: apply
                    status: ok
                    rowsRead: 4
                    created: 0
                    updated: 0
                    unchanged: 4
                    keptApp: 0
                    conflicts: 0
                    failed: 0
                    warnings: []
                    conflictDetails: []
                    errors: []
                conflict:
                  summary: A column edited on both sides — the row is left untouched
                  value:
                    batchId: 7c2d9a44-6b18-4f3e-9a51-0c8e2d1b4f37
                    entity: materials
                    mode: apply
                    status: partial
                    rowsRead: 4
                    created: 0
                    updated: 0
                    unchanged: 3
                    keptApp: 0
                    conflicts: 1
                    failed: 0
                    warnings: []
                    conflictDetails:
                      - conflictId: 1
                        line: 2
                        key: MAT-001
                        column: price
                        base: "26.9"
                        app: "27.5"
                        sheet: "29.9"
                        message: "'price' changed in both the app and the sheet since the last sync. Row left untouched."
                    errors: []
                rowErrors:
                  summary: Bad input — three rejected rows and one ignored column
                  value:
                    batchId: 91f0c6b2-3d47-4e88-b1a9-5f2c7e0d3a16
                    entity: materials
                    mode: validate
                    status: partial
                    rowsRead: 4
                    created: 1
                    updated: 0
                    unchanged: 0
                    keptApp: 0
                    conflicts: 0
                    failed: 3
                    warnings:
                      - line: 0
                        code: UNKNOWN_COLUMN
                        column: коментар
                        message: Column is not managed by the 'materials' importer and was ignored.
                    conflictDetails: []
                    errors:
                      - line: 3
                        column: key
                        value: MAT-010
                        code: DUPLICATE_KEY
                        message: Key 'MAT-010' appears more than once in this file.
                      - line: 4
                        column: name
                        value: null
                        code: EMPTY_REQUIRED
                        message: Column 'name' is required.
                      - line: 5
                        column: price
                        value: "12,34"
                        code: INVALID_NUMBER
                        message: >-
                          Contains ',', but this file is being read with '.' as the decimal
                          separator. Re-send with decimal=comma if the sheet uses ',' for decimals.
        '400':
          description: |
            The file could not be processed at all — nothing was attempted and there is no report.
            When the failure came from parsing, the body carries a `code` from the file-level set
            (`ENCODING`, `MALFORMED_CSV`, `NO_HEADER`, `DUPLICATE_COLUMN`, `MISSING_COLUMN`,
            `ROW_LIMIT_EXCEEDED`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FileError' }
              examples:
                missingColumn:
                  summary: A required column is not in the header
                  value:
                    error: "Missing required column(s): name, unit. Found: key, price."
                    code: MISSING_COLUMN
                encoding:
                  summary: The file is not UTF-8
                  value:
                    error: >-
                      The file is not valid UTF-8. Re-export it as CSV UTF-8 — Cyrillic text in
                      another encoding cannot be recovered reliably.
                    code: ENCODING
                rowLimit:
                  summary: Too many rows
                  value:
                    error: "The file has 61240 rows; the limit is 50000 per import."
                    code: ROW_LIMIT_EXCEEDED
                unknownEntity:
                  summary: No importer registered under that name (no `code`)
                  value:
                    error: "Unknown import entity 'inventories'. Known: [houses, house-stages, materials]."
                noFile:
                  summary: The `file` part is missing or empty (no `code`)
                  value:
                    error: "No file uploaded."
                badMode:
                  summary: Unrecognised `mode` (no `code`)
                  value:
                    error: "mode must be 'validate' or 'apply'."
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '415':
          description: The request was not `multipart/form-data`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '500':
          description: |
            Unexpected server error. Retry once a few minutes later; if it persists, send us the
            `requestId`. Two known causes: a file larger than the 10 MB upload limit (it surfaces
            here rather than as a `413`), and two runs sent at the same time that create the same
            new record — one of them is rolled back entirely. Send one request at a time.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                error: Internal server error
                requestId: 3f9c1a7e-88d2-4b06-9e51-7a2c4d0b6e13

  /api/export/entities:
    get:
      tags: [Export]
      summary: List the exportable datasets, their filters and columns
      description: |
        Derived from the server's exporter registry, so it cannot describe a dataset that does not
        exist or omit one that does. Build your `columns=` list from it.
      operationId: listExportEntities
      responses:
        '200':
          description: The catalogue, alphabetically.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ExportEntityDescriptor' }
              example:
                - name: attendance-daily
                  description: "Timesheet: one row per worker per work day with at least one check-in, hours summed."
                  filters:
                    - { name: from, type: date, required: true, description: "First work day, inclusive (YYYY-MM-DD)." }
                    - { name: to, type: date, required: true, description: "Last work day, inclusive. At most 366 days after `from`." }
                    - { name: houseExternalId, type: text, required: false, description: "Only check-ins at the house with this External ID (the key used by the house import)." }
                  columns:
                    - { name: date, type: date, default: true, description: "Work day (Europe/Sofia)." }
                    - { name: worker_name, type: text, default: true, description: "Worker's name." }
                    - { name: counted_hours, type: decimal, default: true, description: "counted_minutes / 60, two decimals." }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/export/{entity}:
    get:
      tags: [Export]
      summary: Download one dataset as CSV
      description: |
        Besides the parameters below, pass the dataset's own **filters** (from the catalogue) as
        query parameters — `from`, `to` and `houseExternalId` for attendance. Any
        parameter that is neither a declared filter nor one of the format parameters is rejected
        with `400`.
      operationId: exportEntity
      parameters:
        - $ref: '#/components/parameters/ExportEntity'
        - name: columns
          in: query
          required: false
          description: Comma-separated column names, in output order. Omitted = the dataset's default columns.
          schema: { type: string }
          example: date,worker_name,crew_name,counted_hours
        - name: delimiter
          in: query
          required: false
          schema: { type: string, enum: [comma, semicolon, tab], default: comma }
        - name: decimal
          in: query
          required: false
          description: Decimal separator. `comma` requires `delimiter=semicolon` or `tab`.
          schema: { type: string, enum: [dot, comma], default: dot }
        - name: timestamps
          in: query
          required: false
          schema: { type: string, enum: [iso, local], default: iso }
        - name: from
          in: query
          required: false
          description: Attendance datasets — first work day (required there).
          schema: { type: string, format: date }
          example: "2026-09-01"
        - name: to
          in: query
          required: false
          description: Attendance datasets — last work day (required there).
          schema: { type: string, format: date }
          example: "2026-09-30"
        - name: houseExternalId
          in: query
          required: false
          description: |
            Attendance datasets — only check-ins at the house with this External ID, the same key
            the house import uses. An External ID no house carries is a `400`, not an empty file.
          schema: { type: string }
          example: TH-2025-012
      responses:
        '200':
          description: The CSV file (UTF-8 with a byte-order mark).
          headers:
            Content-Disposition:
              description: '`attachment; filename="<entity>_<from>_<to>.csv"`.'
              schema: { type: string }
            X-Export-Rows:
              description: Number of data rows in the file.
              schema: { type: integer }
          content:
            text/csv:
              schema: { type: string }
              example: "date,worker_name,crew_name,counted_hours\r\n2026-09-24,Иван Петров,Crew A,8.58\r\n"
        '400':
          description: Missing/invalid filter, unknown parameter or column, or an invalid dialect.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { error: "Unknown column(s) [hours]. Available: [date, worker_id, ...]." }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: No dataset under that name.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/import/openapi.yaml:
    get:
      tags: [Documentation]
      summary: This document, as YAML
      description: The source of truth for this contract. Feed it to a client generator if you like.
      operationId: getOpenApiYaml
      responses:
        '200':
          description: The specification.
          content:
            application/yaml:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/import/openapi.json:
    get:
      tags: [Documentation]
      summary: This document, as JSON
      operationId: getOpenApiJson
      responses:
        '200':
          description: The specification.
          content:
            application/json:
              schema: { type: object }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        A token from `POST /api/login`, sent as `Authorization: Bearer <token>`. The account must
        have the `importer` role for the import, the `exporter` role for the export, or `admin`.

  parameters:
    Entity:
      name: entity
      in: path
      required: true
      description: |
        The importer name, plural and lower-case, as returned by `GET /api/import/entities`.
        Currently `materials`, `houses` and `house-stages` are available; the remaining entities
        are being rolled out.

        The master sheet is uploaded verbatim to `houses` and then to `house-stages`: each importer
        translates the sheet's own headers (`Project_ID` → `key`, `Project_Name` → `name`,
        `Project_Link` → `drive_folder_url`, `Calculator_SS_Id` → `calculator_sheet_id`,
        `Prj_Master_SS_Id` → `master_sheet_id`; stage columns by stage name) and reports the other
        importer's columns as `UNKNOWN_COLUMN` warnings. See *The master sheet, column by column*
        for what each column and each stage cell means.

        Creating a house also provisions its internal warehouse, stage checklist and check-in code
        automatically. There is deliberately no column for the house's current phase (the
        application derives it from stage progress), and no other client-personal data (national
        id, phone, email, prices) is accepted.
      schema:
        type: string
        example: materials

    ExportEntity:
      name: entity
      in: path
      required: true
      description: The dataset name, as returned by `GET /api/export/entities`.
      schema:
        type: string
        enum: [attendance-daily, attendance-sessions]
        example: attendance-daily

  responses:
    Unauthorized:
      description: No token, or an expired/invalid one.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { error: Unauthorized }
    Forbidden:
      description: Authenticated, but the account's role does not grant this endpoint (`importer` for the import, `exporter` for the export, or `admin`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { error: Forbidden }

  schemas:

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string, format: password }

    LoginResponse:
      type: object
      properties:
        token: { type: string, description: The JWT to send as a bearer token. }
        tokenType: { type: string, example: Bearer }
        expiresIn:
          type: integer
          format: int64
          description: Lifetime in seconds (28800 = 8 hours by default).
        user: { $ref: '#/components/schemas/UserSummary' }

    UserSummary:
      type: object
      properties:
        id: { type: integer }
        username: { type: string }
        role:
          type: string
          description: |
            Must be `importer` or `admin` to use the import endpoints, `exporter` or `admin` for the
            export endpoints. Both external roles are scoped to their API and rejected everywhere
            else in the application.
          enum: [importer, exporter, admin]
          example: importer

    EntityDescriptor:
      type: object
      description: One importable entity, as described by the server's importer registry.
      properties:
        name:
          type: string
          description: The importer name — the `{entity}` path segment, and the conventional file name.
          example: materials
        entityType:
          type: string
          description: Singular namespace under which this entity's external keys are unique.
          example: material
        keyColumn:
          type: string
          description: The CSV column carrying your external key.
          default: key
        required:
          type: array
          description: Columns that must be present in the header **and** non-blank in every row.
          items: { type: string }
          example: [name, unit]
        columns:
          type: object
          description: |
            Every column this importer manages, mapped to how the value is canonicalised before
            comparison. Columns outside this set are ignored with a warning.
          additionalProperties:
            type: string
            enum: [text, decimal, integer, date, timestamp, enum, boolean, pipe_set]
          example: { name: text, price: decimal, unit: text }
        dependsOn:
          type: array
          description: |
            Importers whose files must be applied before this one, by name. A file referencing a key
            that its dependency has not created yet fails with `UNRESOLVED_REF`.
          items: { type: string }
          example: []

    ExportEntityDescriptor:
      type: object
      description: One exportable dataset, as described by the server's exporter registry.
      properties:
        name:
          type: string
          description: The `{entity}` path segment.
          example: attendance-sessions
        description:
          type: string
          description: What one row is.
        filters:
          type: array
          items:
            type: object
            properties:
              name: { type: string, example: from }
              type: { $ref: '#/components/schemas/ExportFilterType' }
              required: { type: boolean }
              description: { type: string }
        columns:
          type: array
          description: Every selectable column, in the default order.
          items:
            type: object
            properties:
              name: { type: string, example: counted_hours }
              type: { $ref: '#/components/schemas/ExportColumnType' }
              default:
                type: boolean
                description: Included when the request passes no `columns`.
              description: { type: string }

    ExportFilterType:
      type: string
      description: '`date` is ISO `YYYY-MM-DD`; `text` is trimmed and matched exactly.'
      enum: [date, integer, text]

    ExportColumnType:
      type: string
      description: |
        How the cell is written. `decimal` honours `decimal=`; `timestamp` honours `timestamps=`;
        `pipe_set` is several values joined with `|`; `text` and `pipe_set` get the formula guard.
      enum: [text, integer, decimal, date, timestamp, boolean, enum, pipe_set]

    ImportReport:
      type: object
      description: |
        The result of one run. The counters partition the rows read: every row lands in exactly one
        of `created`, `updated`, `unchanged`, `keptApp`, `conflicts` or `failed`.
      properties:
        batchId:
          type: string
          format: uuid
          description: Identifies this run in the import history. Quote it when reporting a problem.
        entity:
          type: string
          example: materials
        mode:
          type: string
          enum: [validate, apply]
        status:
          type: string
          enum: [ok, partial, failed]
          description: |
            `ok` — no failures and no conflicts.
            `partial` — some rows failed or conflicted; the rest were processed.
            `failed` — every row failed.
        rowsRead:
          type: integer
          description: Data rows read, excluding the header and blank lines.
        created:
          type: integer
          description: Keys not seen before — a new record was (or would be) inserted.
        updated:
          type: integer
          description: The sheet changed and the app did not — the sheet value was applied.
        unchanged:
          type: integer
          description: Neither side moved. No write at all, which is what a steady-state run should be.
        keptApp:
          type: integer
          description: |
            The app changed and the sheet did not, so the sheet value is stale and the existing
            record wins. Nothing is written and this is **not** an error — it is the sync protecting
            live operational data. If the sheet value is in fact the correct one, edit the sheet so
            it differs from what the previous run saw.
        conflicts:
          type: integer
          description: Rows where a column moved on both sides. Nothing written; see `conflictDetails`.
        failed:
          type: integer
          description: Rows rejected by validation. See `errors`.
        warnings:
          type: array
          items: { $ref: '#/components/schemas/Warning' }
        conflictDetails:
          type: array
          items: { $ref: '#/components/schemas/ConflictDetail' }
        errors:
          type: array
          items: { $ref: '#/components/schemas/RowError' }

    Warning:
      type: object
      description: Non-fatal — the run continued.
      properties:
        line:
          type: integer
          description: Physical line in the file. `0` means the warning is about the file as a whole.
        code: { $ref: '#/components/schemas/ImportErrorCode' }
        column: { type: string, nullable: true }
        message: { type: string }

    ConflictDetail:
      type: object
      description: |
        One column that moved on both sides since the last run. All three values are given so the
        decision can be made by a human. The row is left exactly as it was.
      properties:
        conflictId:
          type: integer
          format: int64
          nullable: true
          description: |
            Identifier of the stored conflict. Conflicts are only persisted in `mode=apply`; in
            `mode=validate` this is `null` because a dry run leaves no trace.
        line: { type: integer, description: Physical line in the file. }
        key: { type: string, description: Your external key for the row. }
        column:
          type: string
          description: |
            The conflicting field. For `house-stages` it is `stage_<n>_status`, `stage_<n>_worker` or
            `stage_<n>_note`, where `<n>` is the stage's internal number — the `message` names the
            stage as it appears in the sheet (`Stage 'Ниво замазка' (status) changed in both …`).
        base:
          type: string
          nullable: true
          description: The value as of the last run — what both sides agreed on.
        app:
          type: string
          nullable: true
          description: What the database holds now.
        sheet:
          type: string
          nullable: true
          description: What this file brings.
        message: { type: string }

    RowError:
      type: object
      description: A row that could not be accepted. It was skipped; the rest of the file continued.
      properties:
        line: { type: integer, description: Physical line in the file, matching the spreadsheet. }
        column:
          type: string
          nullable: true
          description: The offending column, or `null` when the failure is not attributable to one.
        value:
          type: string
          nullable: true
          description: The offending value, or `null` when the cell was empty.
        code: { $ref: '#/components/schemas/ImportErrorCode' }
        message: { type: string, description: Human-readable, safe to show to whoever maintains the sheet. }

    ImportErrorCode:
      type: string
      description: |
        Stable codes — map them to your own messages if you localise.

        **File level** (returned as a `4xx`, no report):
        `ENCODING` not valid UTF-8 ·
        `MALFORMED_CSV` unparseable, or an unsupported delimiter ·
        `NO_HEADER` empty file, or a first row with no usable column names ·
        `DUPLICATE_COLUMN` the same column name twice in the header ·
        `MISSING_COLUMN` a required column is absent ·
        `ROW_LIMIT_EXCEEDED` more than 50 000 data rows

        **Row level** (reported in `errors`, the run continues):
        `EMPTY_REQUIRED` a required cell is blank ·
        `DUPLICATE_KEY` the same key appears twice in one file — not silently last-wins, because the
        result would then depend on row order ·
        `UNRESOLVED_REF` the row refers to a record that does not exist yet — for `house-stages`, no
        house has this key (run `houses` first) ·
        `INVALID_NUMBER` · `INVALID_DATE` · `INVALID_ENUM` (allowed values are listed in the message) ·
        `INVALID_BOOLEAN` · `OUT_OF_RANGE` latitude/longitude outside the valid range ·
        `TOO_LONG` the column's length limit is named in the message ·
        `CONSTRAINT_VIOLATION` rejected by the database ·
        `KEY_REUSED` a key whose identity fields changed wholesale — reserved, not yet emitted

        **Warning** (reported in `warnings`, nothing is rejected):
        `UNKNOWN_COLUMN` a column this importer does not manage; it was ignored ·
        `ADOPTED_EXISTING` a new key matched a record created in the application with the same
        External ID; that record was updated instead of creating a duplicate
      enum:
        - ENCODING
        - MALFORMED_CSV
        - NO_HEADER
        - DUPLICATE_COLUMN
        - MISSING_COLUMN
        - ROW_LIMIT_EXCEEDED
        - EMPTY_REQUIRED
        - DUPLICATE_KEY
        - UNRESOLVED_REF
        - INVALID_NUMBER
        - INVALID_DATE
        - INVALID_ENUM
        - INVALID_BOOLEAN
        - OUT_OF_RANGE
        - TOO_LONG
        - CONSTRAINT_VIOLATION
        - KEY_REUSED
        - UNKNOWN_COLUMN
        - ADOPTED_EXISTING

    ErrorResponse:
      type: object
      properties:
        error: { type: string }
        requestId:
          type: string
          nullable: true
          description: Present on 5xx. Quote it when reporting the problem.

    FileError:
      type: object
      description: A file-level rejection. Nothing was attempted, so there is no report.
      properties:
        error: { type: string }
        code:
          allOf:
            - $ref: '#/components/schemas/ImportErrorCode'
          nullable: true
